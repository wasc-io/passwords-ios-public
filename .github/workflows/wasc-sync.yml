name: wasc upstream sync

# Daily:
#   0. re-enables itself, so GitHub's 60-day inactivity rule never pauses the schedule,
#   1. keeps every non-wasc workflow disabled (wasc-guard.yml; upstream workflows need Bitwarden's secrets),
#   2. re-runs wasc-release.yml when the newest TestFlight build is about to expire,
#   3. merges the newest upstream Password Manager tag (v*-bwpm) into a sync/<tag> branch,
#      lets Claude resolve conflicts / build breaks, and opens a PR against `wasc`.
# See wasc/README.md.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync to (default: newest v*-bwpm)"
        type: string

concurrency:
  group: wasc-sync
  cancel-in-progress: false

permissions: {}

jobs:
  keepalive:
    # GitHub disables scheduled workflows in public repos after 60 days without repository
    # activity, and this schedule is what keeps TestFlight builds from expiring (90 days).
    # Re-enabling an active workflow resets that timer; this is what liskin/gh-workflow-keepalive
    # (v1.2.1, f72ff1a1) does, inlined here instead of pulling in another action. No commits.
    name: Keep schedule alive
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable wasc-sync.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/wasc-sync.yml/enable"

  disable-upstream-workflows:
    name: Disable upstream workflows
    permissions:
      actions: write
    uses: ./.github/workflows/wasc-guard.yml

  stale-check:
    name: TestFlight build freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      _ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      _ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      _ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      _BUNDLE_ID: me.wasc.passwords
      _MAX_AGE_DAYS: "75"
    steps:
      - name: Install PyJWT
        run: python3 -m pip install --user --quiet --break-system-packages "pyjwt[crypto]"

      - name: Check age of newest build
        id: check
        run: |
          python3 - <<'EOF'
          import datetime, json, os, time, urllib.parse, urllib.request
          import jwt

          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["_ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              os.environ["_ASC_KEY_P8"],
              algorithm="ES256",
              headers={"kid": os.environ["_ASC_KEY_ID"], "typ": "JWT"},
          )

          def get(path, **params):
              url = "https://api.appstoreconnect.apple.com" + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          apps = get("/v1/apps", **{"filter[bundleId]": os.environ["_BUNDLE_ID"]})["data"]
          if not apps:
              print(f"::warning::No App Store Connect app for {os.environ['_BUNDLE_ID']} yet; skipping.")
              out.write("stale=false\n")
              raise SystemExit(0)
          builds = get("/v1/builds", **{"filter[app]": apps[0]["id"], "sort": "-uploadedDate", "limit": "1"})["data"]
          if not builds:
              # Nothing to keep alive yet; the first build is dispatched by hand.
              print("::warning::No builds uploaded yet; skipping.")
              out.write("stale=false\n")
              raise SystemExit(0)
          uploaded = datetime.datetime.fromisoformat(builds[0]["attributes"]["uploadedDate"])
          age = (datetime.datetime.now(datetime.timezone.utc) - uploaded).days
          print(f"Newest build {builds[0]['attributes']['version']} uploaded {uploaded.isoformat()} ({age} days ago)")
          out.write(f"stale={'true' if age >= int(os.environ['_MAX_AGE_DAYS']) else 'false'}\n")
          EOF

      - name: Trigger a fresh TestFlight build
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Newest TestFlight build is $_MAX_AGE_DAYS+ days old; dispatching wasc-release.yml"
          gh workflow run wasc-release.yml -R "$GITHUB_REPOSITORY" --ref wasc

  sync:
    name: Merge upstream tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.find.outputs.branch }}
      tag: ${{ steps.find.outputs.tag }}
    env:
      _TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Check out wasc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wasc
          fetch-depth: 0
          # Upstream merges usually touch .github/workflows, which GITHUB_TOKEN may not push.
          # WASC_SYNC_TOKEN: fine-grained PAT with contents, pull-requests and workflows write.
          token: ${{ secrets.WASC_SYNC_TOKEN || github.token }}

      - name: Find newest upstream tag
        id: find
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/bitwarden/ios.git
          # Upstream tags go to their own namespace, never refs/tags, so they cannot clash with
          # (or overwrite) the fork's own tags such as wasc-v*.
          git fetch --quiet --no-tags upstream '+refs/tags/v*-bwpm:refs/upstream-tags/v*-bwpm'
          current=$(tr -d '[:space:]' < wasc/upstream-tag)
          latest=${_TAG_INPUT:-$(git for-each-ref --format='%(refname:lstrip=2)' 'refs/upstream-tags/v*-bwpm' | sort -V | tail -n 1)}
          echo "current=$current latest=$latest"
          if ! git rev-parse --verify --quiet "refs/upstream-tags/$latest^{commit}" > /dev/null; then
            echo "::error::Upstream has no tag $latest matching v*-bwpm"
            exit 1
          fi
          if [ "$latest" = "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "Up to date."
            exit 0
          fi
          branch="sync/$latest"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; resolve its PR first."
            exit 0
          fi
          {
            echo "tag=$latest"
            echo "current=$current"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.find.outputs.tag != ''
        env:
          _TAG: ${{ steps.find.outputs.tag }}
          _BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$_BRANCH"
          if git merge --no-ff -m "Merge upstream tag $_TAG" "refs/upstream-tags/$_TAG"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
            # The fork's placeholder icons are binary; always keep ours.
            if git checkout --ours -- '*Icon-1024.png' 2>/dev/null; then
              git add -- '*Icon-1024.png' || true
            fi
          fi

      - name: Resolve conflicts with Claude
        if: steps.merge.outputs.conflicts == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            This repository is wasc passwords, a minimal fork of bitwarden/ios. The branch
            `${{ steps.find.outputs.branch }}` is in the middle of `git merge ${{ steps.find.outputs.tag }}`
            and has conflicts. Read wasc/README.md first: it lists every change the fork carries.
            Resolve every conflicted file so that upstream's new code is kept and the wasc changes
            listed in wasc/README.md are re-applied on top. Keep the fork diff as small as possible.
            Then `git add` the resolved files. Do NOT commit, push or touch git config.
            Finish with a short summary of what you resolved.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git log:*),Bash(git show:*),Bash(git checkout:*),Bash(git rm:*)"

      - name: Commit, push and open PR
        if: steps.find.outputs.tag != ''
        env:
          # The repo does not let GITHUB_TOKEN create (or approve) PRs, so opening the PR needs
          # WASC_SYNC_TOKEN. Without it the branch is still pushed and a compare link is logged.
          GH_TOKEN: ${{ secrets.WASC_SYNC_TOKEN || github.token }}
          _TAG: ${{ steps.find.outputs.tag }}
          _CURRENT: ${{ steps.find.outputs.current }}
          _BRANCH: ${{ steps.find.outputs.branch }}
          _CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail
          if [ -n "$(git diff --name-only --diff-filter=U)" ] || git grep -lE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.png' > /dev/null; then
            echo "::error::Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi
          echo "$_TAG" > wasc/upstream-tag
          git add wasc/upstream-tag
          git commit -m "wasc: sync upstream $_TAG"
          git push origin "$_BRANCH"
          note="Merged cleanly."
          if [ "$_CONFLICTS" = "true" ]; then
            note="Conflicts were resolved by Claude: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt"). Review them carefully."
          fi
          if ! gh pr create --base wasc --head "$_BRANCH" \
            --title "Sync upstream $_TAG" \
            --body "Merges upstream \`$_TAG\` (previous: \`$_CURRENT\`). $note

          The **verify** job builds the app for the simulator on this branch and lets Claude fix build breaks.
          After merging, run *wasc release (TestFlight)*."; then
            echo "::warning::Could not open the PR (set WASC_SYNC_TOKEN). Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/wasc...$_BRANCH"
          fi

  disable-after-sync:
    # The pushed sync branch may carry new upstream workflows, which GitHub enables on arrival.
    name: Disable upstream workflows (after sync)
    needs: sync
    if: needs.sync.outputs.branch != ''
    permissions:
      actions: write
    uses: ./.github/workflows/wasc-guard.yml

  verify:
    name: Simulator build
    needs: sync
    if: needs.sync.outputs.branch != ''
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      MINT_PATH: .mint/lib
      MINT_LINK_PATH: .mint/bin
      _BRANCH: ${{ needs.sync.outputs.branch }}
    steps:
      - name: Check out sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.branch }}
          token: ${{ secrets.WASC_SYNC_TOKEN || github.token }}

      - name: Read Xcode version
        run: echo "_XCODE_VERSION=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_ENV"

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env._XCODE_VERSION }}

      - name: Install dependencies
        run: |
          # Keep tool caches and build output out of any fix commit.
          printf '.mint/\nexport/\n' >> .git/info/exclude
          brew install mint
          mint bootstrap

      - name: Build for simulator
        id: build
        run: |
          set -o pipefail
          if ./Scripts/build.sh project-pm.yml Bitwarden Simulator 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            grep -E 'error:' "$RUNNER_TEMP/build.log" | sort -u | head -n 100 > "$RUNNER_TEMP/errors.txt" || true
          fi

      - name: Fix build with Claude
        if: steps.build.outputs.ok == 'false'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            This repository is wasc passwords, a minimal fork of bitwarden/ios (read wasc/README.md).
            Branch `${{ needs.sync.outputs.branch }}` merges a new upstream tag and the simulator build
            (`./Scripts/build.sh project-pm.yml Bitwarden Simulator`) fails. The compiler errors are in
            ${{ runner.temp }}/errors.txt and the full log in ${{ runner.temp }}/build.log.
            Fix the build with the smallest change that keeps the wasc changes from wasc/README.md.
            Re-run the build to confirm. Do NOT commit or push. Summarize what you changed.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./Scripts/build.sh:*),Bash(git status:*),Bash(git diff:*),Bash(grep:*),Bash(tail:*)"

      - name: Push fix and report
        if: always() && steps.build.outputs.ok != ''
        env:
          GH_TOKEN: ${{ secrets.WASC_SYNC_TOKEN || github.token }}
          _OK: ${{ steps.build.outputs.ok }}
        run: |
          set -euo pipefail
          comment() {
            gh pr comment "$_BRANCH" --body "$1" || echo "::warning::No PR for $_BRANCH: $1"
          }
          if [ "$_OK" = "true" ]; then
            comment "Simulator build passed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The build regenerates the acknowledgements in Settings.bundle; that is noise, not a fix.
          git checkout -- '*/Settings.bundle' 2>/dev/null || true
          git clean -fdq -- '*/Settings.bundle'
          if [ -z "$(git status --porcelain)" ]; then
            comment "Simulator build failed and Claude made no changes. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          git add -A
          git commit -m "wasc: fix build after upstream sync"
          git push origin "HEAD:$_BRANCH"
          comment "Simulator build failed; Claude pushed a fix. Review it, and re-run the build if needed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
