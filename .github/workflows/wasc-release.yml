name: wasc release (TestFlight)

# Builds the Bitwarden scheme with the wasc identifiers (wasc/wasc-bwpm.xcconfig), signs it
# manually with the fork's own Apple Distribution certificate and the App Store profiles from
# App Store Connect, and uploads it to TestFlight. See wasc/README.md for the Apple-side setup.

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: "CFBundleVersion override (default: run number * 10 + run attempt + 100)"
        type: string
      upload:
        description: "Upload to TestFlight (off = export the .ipa as an artifact only)"
        type: boolean
        default: true
  push:
    tags:
      - "wasc-v*"

concurrency:
  group: wasc-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MINT_PATH: .mint/lib
      MINT_LINK_PATH: .mint/bin
      _UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      _BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
      _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      _ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      _ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      _EXPORT_COMPLIANCE_CODE: ${{ vars.WASC_EXPORT_COMPLIANCE_CODE }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required secrets
        env:
          _ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          _DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          _DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          missing=0
          for name in _APPLE_TEAM_ID _ASC_KEY_ID _ASC_ISSUER_ID _ASC_KEY_P8 _DIST_CERT_P12_BASE64 _DIST_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::secret ${name#_} is not set"; missing=1; fi
          done
          exit "$missing"

      - name: Optimize macOS Runner
        uses: ./.github/actions/macos-runner-tuneup

      - name: Read Xcode version
        run: echo "_XCODE_VERSION=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_ENV"

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env._XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: brew install mint yq

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mint packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap

      - name: Install Python dependencies
        run: python3 -m pip install --user --quiet --break-system-packages "pyjwt[crypto]"

      # altool on Xcode 26 can upload to the wrong app or fail silently without --apple-id,
      # so resolve the numeric App Store Connect app id up front (and fail before archiving).
      - name: Resolve App Store Connect app id
        if: env._UPLOAD == 'true'
        env:
          _ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 wasc/ci/asc.py app-id me.wasc.passwords

      # A throwaway keychain holding only the fork's dedicated Apple Distribution identity
      # (not the certificate the other apps of the team sign with).
      - name: Install distribution certificate
        env:
          _DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          _DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/wasc-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          p12="$RUNNER_TEMP/dist.p12"
          printf '%s' "$_DIST_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put it first in the user search list, keeping the existing keychains.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Distribution: /{print $2; exit}')
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::DIST_CERT_P12_BASE64 holds no valid Apple Distribution identity"
            exit 1
          fi
          echo "Signing identity $identity"
          echo "_DIST_CERT_SHA1=$identity" >> "$GITHUB_ENV"

      - name: Configure version, signing and plists
        run: |
          set -euo pipefail
          upstream_tag=$(tr -d '[:space:]' < wasc/upstream-tag)
          version_name=${upstream_tag#v}
          version_name=${version_name%-bwpm}
          # Unique per run and per re-run attempt.
          build_number=${_BUILD_NUMBER_INPUT:-$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT + 100))}
          echo "Version $version_name ($build_number) from $upstream_tag"
          echo "_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          yq -i ".settings.MARKETING_VERSION = \"$version_name\"" project-pm.yml
          yq -i ".settings.CURRENT_PROJECT_VERSION = \"$build_number\"" project-pm.yml

          # Local-bwpm.xcconfig is included after wasc/wasc-bwpm.xcconfig and after the
          # CODE_SIGN_IDENTITY = Apple Development line of Configs/Bitwarden-Release.xcconfig,
          # so it wins: the archive is signed for distribution.
          # The provisioning profile lines are appended by the next step.
          cat > Configs/Local-bwpm.xcconfig <<EOF
          DEVELOPMENT_TEAM = $_APPLE_TEAM_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF

          # Production APNs (the passwords-push relay sends to api.push.apple.com). This matches
          # the App Store distribution profile the archive is signed with.
          plutil -replace aps-environment -string production Bitwarden/Application/Support/Bitwarden.entitlements

          # Bitwarden's own export compliance code must not be shipped. Ours is optional.
          plutil -remove ITSEncryptionExportComplianceCode Bitwarden/Application/Support/Info.plist || true
          if [ -n "$_EXPORT_COMPLIANCE_CODE" ]; then
            plutil -replace ITSEncryptionExportComplianceCode -string "$_EXPORT_COMPLIANCE_CODE" Bitwarden/Application/Support/Info.plist
          fi

          plutil -lint Bitwarden/Application/Support/Bitwarden.entitlements Bitwarden/Application/Support/Info.plist

      # Profiles are created (and regenerated after capability changes) outside CI with an admin
      # key; this read-only step picks the newest ACTIVE one per target. See wasc/README.md.
      - name: Install provisioning profiles
        env:
          _ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 wasc/ci/asc.py profiles Configs/Local-bwpm.xcconfig "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Generate Xcode projects
        run: |
          mint run xcodegen --spec project-bwk.yml
          mint run xcodegen --spec project-pm.yml

      - name: Archive
        run: |
          set -o pipefail
          xcrun xcodebuild archive \
            -workspace Bitwarden.xcworkspace \
            -scheme Bitwarden \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Bitwarden.xcarchive \
            -derivedDataPath build/DerivedData \
            -quiet

      - name: Export .ipa
        run: |
          xcrun xcodebuild -exportArchive \
            -archivePath build/Bitwarden.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/export

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasc-passwords-${{ env._VERSION_NAME }}-${{ env._BUILD_NUMBER }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: env._UPLOAD == 'true'
        env:
          _ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool reads the key from ~/private_keys/AuthKey_<id>.p8.
          (umask 077 && mkdir -p ~/private_keys && printf '%s\n' "$_ASC_KEY_P8" > ~/private_keys/AuthKey_"$_ASC_KEY_ID".p8)
          ipa=$(find build/export -maxdepth 1 -name '*.ipa' | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apple-id "$_ASC_APP_ID" \
            --apiKey "$_ASC_KEY_ID" \
            --apiIssuer "$_ASC_ISSUER_ID"

      # CI cannot repair signing itself: its API key has the Developer role, and profiles are
      # created outside CI. Turn the usual cryptic codesign errors into the fix.
      - name: Signing hint (failed)
        if: failure()
        run: |
          {
            echo "### Release failed"
            echo
            echo "If the log mentions a **certificate, provisioning profile, entitlement, app group or iCloud container**:"
            echo
            echo "1. A new target or capability needs its bundle ID, capabilities and portal assignments first (wasc/README.md, Apple prerequisites)."
            echo "2. Then regenerate the \`wasc passwords AppStore *\` profiles for the fork's Apple Distribution certificate (agent-side \`scripts/asc/profiles.py\` with an admin key, not available to CI) and re-run this job."
            echo "3. An expired or revoked certificate means a new one plus new \`DIST_CERT_P12_BASE64\` / \`DIST_CERT_PASSWORD\` secrets, then step 2."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=wasc release failed::For signing errors: fix bundle IDs/capabilities in the portal, regenerate the 'wasc passwords AppStore *' profiles, re-run (see job summary and wasc/README.md)."

      - name: Summary
        if: always()
        run: |
          {
            echo "### wasc passwords ${_VERSION_NAME:-?} (${_BUILD_NUMBER:-?})"
            echo "- upstream: $(cat wasc/upstream-tag)"
            echo "- uploaded to TestFlight: ${_UPLOAD}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "${_KEYCHAIN_PATH:-}" ]; then security delete-keychain "$_KEYCHAIN_PATH" || true; fi
